<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kimi Paper · 持续写作工作台样稿</title><link rel="stylesheet" href="style.css"></head><body>
<header><button id="sidebar-toggle" class="icon" aria-label="展开或收起项目导航"></button><b>Kimi Paper</b><button id="project-switch" class="project"></button><span class="demo">交互样稿 · 未连接 Kimi</span><div class="header-actions"><button data-action="files">文件</button><button data-action="history">版本</button><button data-action="git">GitHub</button></div></header>
<div class="workspace"><aside id="sidebar"></aside><section id="chat"><div id="chat-heading"></div><div id="messages" aria-label="会话记录"></div><div id="composer"></div></section><div id="divider" role="separator" tabindex="0" aria-label="调整对话区域宽度" aria-orientation="vertical" aria-valuemin="30" aria-valuemax="65" aria-valuenow="45"></div><section id="document"></section></div>
<section id="selection-popup" aria-label="划选翻译与批注" hidden></section><dialog id="dialog" aria-label="项目操作"><button class="close icon" data-action="close" aria-label="关闭弹窗">×</button><div id="modal"></div></dialog><div id="toast" role="status"></div><script type="module" src="app.js"></script></body></html>
